# CI + CD. CI: só gates determinísticos, nenhum agent, nenhum LLM, nenhum
# legado executado — é a mesma linha dos hooks locais (AGENTS.md), espelhada
# no GitHub para quem clonar sem configurar nada. CD: publica docs/ (o
# dashboard estático da memória) no GitHub Pages, só depois dos gates
# passarem — não existe "produção" além disso neste projeto (reflow é um
# CLI local; o dashboard de teste em dashboard/ roda só em loopback e nunca
# é implantado em lugar nenhum).
#
# `scan --staged` é o gate local do pre-commit e depende do índice do Git;
# num checkout da CI não existe staged, então o gate equivalente aqui é o
# `scan` da working tree completa (o `scan_repository`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux cobre o caminho POSIX (fcntl no lock do fs.py); Windows é a
        # plataforma-alvo real (PAD, mklink no teste de junction, msvcrt).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # Travado no SHA da v10.3.2: essa action **não publica tag major**
      # (`v10` não existe, só `v10.x.y`) — usar `@v10` quebra o job no
      # "Set up job" com `Unable to resolve action`. SHA + comentário da
      # versão é também a prática segura de supply chain.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Instala dependências (sem reescrever o lock)
        run: uv sync --frozen
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Formatação (ruff format)
        run: uv run ruff format --check .
      # A suíte inteira inclui a paridade dos três harnesses (sync_agents,
      # copilot, skills, commands) — não precisa de job separado.
      - name: Suíte completa (unit + regression + integration)
        run: uv run python -m pytest
      - name: Scan de segredo/PII (working tree)
        run: uv run python -m reflow scan
      - name: Lint Robin (estrutura dos .robin)
        run: uv run python -m reflow lint-robin --all

  frontend:
    name: frontend (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Testes do frontend do dashboard
        run: node --test tests/frontend/dashboard.test.cjs

  # Publica docs/ (dashboard da memória) no GitHub Pages pelo próprio
  # Actions — antes disso o Pages usava o modo legado (deploy direto da
  # branch, sem nenhuma execução visível). Só roda depois que checks e
  # frontend passarem, e só em push na main (nunca em pull_request) — PR de
  # fora não publica nada. `needs` nos dois faz o Actions desenhar a
  # pipeline completa (checks → frontend → deploy) num único grafo visual.
  deploy:
    name: deploy (GitHub Pages)
    needs: [checks, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Grupo próprio (não o "ci-<ref>" do workflow inteiro): nunca cancelar
    # um deploy do Pages já em andamento — enfileira o próximo em vez de
    # derrubar o que está publicando.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Configura o GitHub Pages
        uses: actions/configure-pages@v6
      - name: Empacota docs/ como artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
