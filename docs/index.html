<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memória do Reflow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f3f6f0;
    --surface:#ffffff;
    --surface-2:#e9ede2;
    --border:#d5ddc9;
    --text:#1b2318;
    --text-muted:#5c6a56;
    --accent:#386956;
    --accent-strong:#28503f;
    --accent-soft:#e0ebe1;

    --tipo-diagnostico:#a1711c;    --tipo-diagnostico-soft:#f5ead1;
    --tipo-correcao:#386956;       --tipo-correcao-soft:#e0ebe1;
    --tipo-implementacao:#45549e; --tipo-implementacao-soft:#e3e6f5;
    --tipo-manutencao:#2f6a78;     --tipo-manutencao-soft:#dcebee;
    --tipo-regra:#7c4f98;         --tipo-regra-soft:#efe3f4;
    --tipo-nota:#5c6a56;          --tipo-nota-soft:#e9ede2;

    --status-concluido:#2f7e52;       --status-concluido-soft:#dfefe3;
    --status-em-andamento:#a1711c;    --status-em-andamento-soft:#f5ead1;
    --status-bloqueado:#b3452e;       --status-bloqueado-soft:#f6e1da;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121712; --surface:#181e17; --surface-2:#1f271e; --border:#2c362a;
      --text:#e8ece3; --text-muted:#9bab93;
      --accent:#86cfab; --accent-strong:#a6e0c1; --accent-soft:#1c2c21;

      --tipo-diagnostico:#e3b35b;    --tipo-diagnostico-soft:#2e2615;
      --tipo-correcao:#86cfab;       --tipo-correcao-soft:#1c2c21;
      --tipo-implementacao:#a7b2f2; --tipo-implementacao-soft:#1f2338;
      --tipo-manutencao:#7fd0e3;     --tipo-manutencao-soft:#16292d;
      --tipo-regra:#d2a5e8;         --tipo-regra-soft:#2a2032;
      --tipo-nota:#9bab93;          --tipo-nota-soft:#1f271e;

      --status-concluido:#7fd3a0;       --status-concluido-soft:#17281d;
      --status-em-andamento:#e3b35b;    --status-em-andamento-soft:#2e2615;
      --status-bloqueado:#e38a74;       --status-bloqueado-soft:#301d17;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121712; --surface:#181e17; --surface-2:#1f271e; --border:#2c362a;
    --text:#e8ece3; --text-muted:#9bab93;
    --accent:#86cfab; --accent-strong:#a6e0c1; --accent-soft:#1c2c21;

    --tipo-diagnostico:#e3b35b;    --tipo-diagnostico-soft:#2e2615;
    --tipo-correcao:#86cfab;       --tipo-correcao-soft:#1c2c21;
    --tipo-implementacao:#a7b2f2; --tipo-implementacao-soft:#1f2338;
    --tipo-manutencao:#7fd0e3;     --tipo-manutencao-soft:#16292d;
    --tipo-regra:#d2a5e8;         --tipo-regra-soft:#2a2032;
    --tipo-nota:#9bab93;          --tipo-nota-soft:#1f271e;

    --status-concluido:#7fd3a0;       --status-concluido-soft:#17281d;
    --status-em-andamento:#e3b35b;    --status-em-andamento-soft:#2e2615;
    --status-bloqueado:#e38a74;       --status-bloqueado-soft:#301d17;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:"Archivo","Segoe UI",system-ui,sans-serif; text-wrap:balance; letter-spacing:-0.01em;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  a{color:var(--accent-strong);}
  button{font-family:inherit;}

  .shell{display:flex; flex-direction:column; min-height:100vh;}

  header.topbar{
    border-bottom:1px solid var(--border); background:var(--surface);
    padding:20px clamp(16px,4vw,40px); display:flex; flex-wrap:wrap; gap:18px;
    align-items:flex-end; justify-content:space-between;
  }
  .topbar-title h1{font-size:1.5rem; margin:0 0 4px; font-weight:700;}
  .topbar-title p{margin:0; color:var(--text-muted); font-size:.92rem;}
  .topbar-title .eyebrow{display:block; text-transform:uppercase; letter-spacing:.08em; font-size:.7rem; color:var(--accent-strong); font-weight:600; margin-bottom:6px;}

  .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-tile{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 14px; min-width:96px;}
  .stat-tile .n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:1.2rem; font-weight:600; color:var(--accent-strong); line-height:1.1;}
  .stat-tile .l{font-size:.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;}

  .project-tabs{
    display:flex; gap:4px; flex-wrap:wrap; padding:12px clamp(16px,4vw,40px);
    background:var(--surface-2); border-bottom:1px solid var(--border);
  }
  .tab{
    border:1px solid transparent; background:none; color:var(--text-muted);
    padding:7px 14px; border-radius:8px; font-size:.86rem; font-weight:600; cursor:pointer;
  }
  .tab:hover{background:var(--surface);}
  .tab[aria-pressed="true"]{background:var(--surface); color:var(--accent-strong); border-color:var(--border); box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .tab .count{font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--text-muted); margin-left:5px;}

  .layout{flex:1; display:grid; grid-template-columns:320px 1fr; max-width:1280px; width:100%; margin:0 auto; min-height:0;}
  @media (max-width:880px){ .layout{grid-template-columns:1fr;} aside.rail{max-height:46vh;} }

  aside.rail{border-right:1px solid var(--border); padding:18px 16px 24px; display:flex; flex-direction:column; gap:14px; overflow-y:auto;}
  .search-box{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:9px; background:var(--surface); padding:8px 10px;}
  .search-box input{border:none; outline:none; background:transparent; color:var(--text); font-size:.92rem; width:100%; font-family:inherit;}
  .search-box svg{flex:none; color:var(--text-muted);}

  .filters{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{border:1px solid var(--border); background:var(--surface); color:var(--text-muted); border-radius:999px; padding:4px 11px; font-size:.76rem; cursor:pointer; font-weight:600; letter-spacing:.01em;}
  .chip:hover{border-color:var(--accent);}
  .chip[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent);}
  .chip:focus-visible, .search-box:focus-within, .note-item:focus-visible, .wikilink:focus-visible, .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .note-group-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); margin:6px 0 2px; font-weight:600;}
  .note-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px;}
  .note-item{width:100%; text-align:left; border:1px solid transparent; background:none; border-radius:9px; padding:8px 10px; cursor:pointer; color:var(--text); display:flex; flex-direction:column; gap:4px;}
  .note-item:hover{background:var(--surface-2);}
  .note-item[aria-current="true"]{background:var(--accent-soft); border-color:var(--accent);}
  .note-item .t{font-size:.86rem; font-weight:600; line-height:1.3;}
  .note-item .meta{display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--text-muted);}
  .note-item .dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .empty-hint{color:var(--text-muted); font-size:.85rem; padding:10px 2px;}

  main.detail{padding:28px clamp(16px,4vw,44px) 60px; min-width:0;}
  .detail-header{border-bottom:1px solid var(--border); padding-bottom:18px; margin-bottom:22px;}
  .detail-folder{font-size:.74rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.07em; font-weight:600; margin-bottom:8px;}
  .detail-header h1{font-size:1.5rem; margin:0 0 12px; font-weight:700; line-height:1.3;}

  .pill{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 11px; font-size:.76rem; font-weight:600;}
  .pillrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px;}
  .refrow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
  .ref-chip{font-size:.74rem; border:1px solid var(--border); border-radius:6px; padding:2px 8px; color:var(--text-muted); background:var(--surface-2);}
  .ref-chip b{color:var(--text); font-weight:600;}
  .tagrow{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
  .tag{font-size:.72rem; color:var(--accent-strong); background:var(--accent-soft); border-radius:6px; padding:2px 8px;}

  .prose{max-width:760px; line-height:1.65; font-size:.98rem;}
  .prose h1,.prose h2{font-size:1.18rem; margin:1.4em 0 .6em; font-weight:700;}
  .prose h3{font-size:1.02rem; margin:1.3em 0 .5em; font-weight:700;}
  .prose p{margin:.7em 0;}
  .prose ul,.prose ol{padding-left:1.3em;}
  .prose li{margin:.3em 0;}
  .prose li.task-list-item{list-style:none; margin-left:-1.3em; padding-left:1.3em;}
  .prose input[type="checkbox"]{margin-right:.5em; accent-color:var(--accent);}
  .prose code{font-family:"IBM Plex Mono",monospace; font-size:.86em; background:var(--surface-2); border-radius:4px; padding:.1em .35em;}
  .prose strong{color:var(--text);}
  .prose .wikilink{background:none; border:none; padding:0; color:var(--accent-strong); text-decoration:underline; text-decoration-color:var(--border); cursor:pointer; font:inherit;}
  .prose .wikilink:hover{text-decoration-color:var(--accent-strong);}
  .prose .wikilink-missing{color:var(--text-muted); text-decoration:underline dotted var(--border); cursor:help;}
  .table-wrap{overflow-x:auto; margin:1em 0; border:1px solid var(--border); border-radius:8px;}
  .prose table{border-collapse:collapse; width:100%; font-size:.88rem; min-width:480px;}
  .prose th,.prose td{border-bottom:1px solid var(--border); padding:7px 10px; text-align:left; vertical-align:top;}
  .prose thead th{background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:.74rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
  .prose tr:last-child td{border-bottom:none;}

  footer.pagefoot{border-top:1px solid var(--border); padding:14px clamp(16px,4vw,40px); color:var(--text-muted); font-size:.78rem; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}

  .load-state{padding:40px; color:var(--text-muted); font-size:.95rem;}
</style>
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="topbar-title">
      <span class="eyebrow">Basic Memory &middot; snapshot est&aacute;tico, GitHub Pages</span>
      <h1>Mem&oacute;ria do Reflow</h1>
      <p id="subtitle">Carregando notas&hellip;</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="project-tabs" id="project-tabs"></nav>

  <div class="layout">
    <aside class="rail">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Buscar por t&iacute;tulo, tag, ADR&hellip;" autocomplete="off">
      </div>
      <div class="filters" id="filters"></div>
      <div id="rail-list"><p class="load-state">Carregando&hellip;</p></div>
    </aside>

    <main class="detail" id="detail"><p class="load-state">Carregando dados de <code>data.json</code>&hellip;</p></main>
  </div>

  <footer class="pagefoot">
    <span id="foot-left">&nbsp;</span>
    <span>Gerado a partir do Basic Memory local por <span class="mono">scripts/basic_memory_dashboard.py</span> &mdash; atualiza a cada push que o regenerar.</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
(function(){
  "use strict";

  var CATEGORY_BUCKET = {
    "diagnostico":"diagnostico", "correcao":"correcao",
    "implementacao":"implementacao", "trabalho-dev":"implementacao",
    "manutencao":"manutencao", "configuracao":"manutencao",
    "regra":"regra", "nota":"nota"
  };
  var PROJECT_FALLBACK_LABEL = { "instructions":"Instruções & regras" };

  var railList = document.getElementById("rail-list");
  var filtersEl = document.getElementById("filters");
  var searchEl = document.getElementById("search");
  var detailEl = document.getElementById("detail");
  var statsEl = document.getElementById("stats");
  var tabsEl = document.getElementById("project-tabs");
  var subtitleEl = document.getElementById("subtitle");
  var footLeft = document.getElementById("foot-left");

  var DATA = { notes: [], projects: [] };
  var state = { query:"", categoria:"all", project:"all", selected:null };

  function fmtDate(iso, hora){
    if(!iso) return "";
    var MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    var p = iso.split("-");
    var out = p[2] + " " + MESES[parseInt(p[1],10)-1] + " " + p[0];
    return hora ? out + " · " + hora : out;
  }

  function projectLabel(id){
    var found = DATA.projects.filter(function(p){ return p.id===id; })[0];
    return found ? found.label : (PROJECT_FALLBACK_LABEL[id] || id);
  }

  function renderTabs(){
    var counts = {};
    DATA.notes.forEach(function(n){ counts[n.project] = (counts[n.project]||0)+1; });
    var tabs = [{id:"all", label:"Todos"}].concat(DATA.projects.map(function(p){ return {id:p.id, label:p.label}; }));
    tabsEl.innerHTML = tabs.map(function(t){
      var n = t.id==="all" ? DATA.notes.length : (counts[t.id]||0);
      return '<button class="tab" data-project="'+t.id+'" aria-pressed="'+(state.project===t.id)+'">'+t.label+'<span class="count">'+n+'</span></button>';
    }).join("");
    Array.prototype.forEach.call(tabsEl.querySelectorAll(".tab"), function(btn){
      btn.addEventListener("click", function(){
        state.project = btn.getAttribute("data-project");
        state.categoria = "all";
        renderTabs(); renderFilters(); renderList();
      });
    });
  }

  function renderStats(){
    var adrs = {};
    DATA.notes.forEach(function(n){
      var haystacks = [n.content||""].concat(
        Object.keys(n.meta||{}).map(function(k){
          var v = n.meta[k];
          return Array.isArray(v) ? v.join(" ") : String(v);
        })
      );
      haystacks.forEach(function(h){
        var m = h.match(/ADR-\d+/g);
        if(m) m.forEach(function(a){ adrs[a]=1; });
      });
    });
    var tiles = [
      {n: DATA.notes.length, l:"Notas"},
      {n: DATA.projects.length, l:"Projetos"},
      {n: Object.keys(adrs).length, l:"ADRs"}
    ];
    statsEl.innerHTML = tiles.map(function(t){
      return '<div class="stat-tile"><div class="n">'+t.n+'</div><div class="l">'+t.l+'</div></div>';
    }).join("");
  }

  function categoriesInScope(){
    var scoped = DATA.notes.filter(function(n){ return state.project==="all" || n.project===state.project; });
    var seen = {}, order = [];
    scoped.forEach(function(n){ if(!seen[n.categoria]){ seen[n.categoria]=n.categoriaLabel; order.push(n.categoria); } });
    return order.map(function(c){ return {slug:c, label:seen[c]}; });
  }

  function renderFilters(){
    var cats = categoriesInScope();
    var html = '<button class="chip" data-cat="all" aria-pressed="'+(state.categoria==="all")+'">Todas</button>';
    cats.forEach(function(c){
      html += '<button class="chip" data-cat="'+c.slug+'" aria-pressed="'+(state.categoria===c.slug)+'">'+c.label+'</button>';
    });
    filtersEl.innerHTML = html;
    Array.prototype.forEach.call(filtersEl.querySelectorAll(".chip"), function(btn){
      btn.addEventListener("click", function(){
        state.categoria = btn.getAttribute("data-cat");
        renderFilters(); renderList();
      });
    });
  }

  function matches(n){
    if(state.project!=="all" && n.project!==state.project) return false;
    if(state.categoria!=="all" && n.categoria!==state.categoria) return false;
    if(!state.query) return true;
    var q = state.query.toLowerCase();
    var hay = (n.title+" "+(n.atividade||"")+" "+n.tags.join(" ")+" "+JSON.stringify(n.meta||{})).toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function heading(n){
    var firstLine = (n.content||"").split("\n")[0];
    if(firstLine.indexOf("# ")===0) return firstLine.slice(2).trim();
    return n.title;
  }

  function renderList(){
    var items = DATA.notes.filter(matches);
    var html = "";
    if(state.project==="all"){
      var byProject = {};
      items.forEach(function(n){ (byProject[n.project]=byProject[n.project]||[]).push(n); });
      DATA.projects.forEach(function(p){
        var group = byProject[p.id];
        if(!group || !group.length) return;
        html += '<div class="note-group-label">'+p.label+'</div><ul class="note-list">'+group.map(renderItem).join("")+'</ul>';
      });
    } else if(items.length){
      html = '<ul class="note-list">'+items.map(renderItem).join("")+'</ul>';
    }
    if(!html) html = '<p class="empty-hint">Nenhuma nota corresponde à busca.</p>';
    railList.innerHTML = html;
    Array.prototype.forEach.call(railList.querySelectorAll(".note-item"), function(btn){
      btn.addEventListener("click", function(){
        state.selected = btn.getAttribute("data-id");
        renderList(); renderDetail();
      });
    });
    if(!state.selected && items.length){ state.selected = items[0].id; renderDetail(); }
  }

  function renderItem(n){
    var bucket = CATEGORY_BUCKET[n.categoria] || "nota";
    return '<li><button class="note-item" data-id="'+n.id+'" aria-current="'+(state.selected===n.id)+'">'+
      '<span class="t">'+heading(n)+'</span>'+
      '<span class="meta"><span class="dot" style="background:var(--tipo-'+bucket+')"></span>'+
      n.categoriaLabel+' · '+fmtDate(n.data,null)+'</span></button></li>';
  }

  function linkify(md){
    return md.replace(/\[\[([^\]]+)\]\]/g, function(full, title){
      var t = title.trim();
      var target = DATA.notes.filter(function(n){ return n.title.toLowerCase()===t.toLowerCase(); })[0];
      if(target) return '<a href="#" class="wikilink" data-target="'+target.id+'">'+t+'</a>';
      return '<span class="wikilink-missing" title="Fora deste snapshot do Basic Memory">'+t+'</span>';
    });
  }

  function wrapTables(html){
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
  }

  function renderDetail(){
    var note = DATA.notes.filter(function(n){ return n.id===state.selected; })[0];
    if(!note){ detailEl.innerHTML = '<p class="empty-hint">Selecione uma nota.</p>'; return; }
    var raw = (note.content||"").replace(/^#\s+.*\n+/, "");
    var html = marked.parse(linkify(raw));
    var bucket = CATEGORY_BUCKET[note.categoria] || "nota";

    var pills = '<div class="pillrow">' +
      '<span class="pill" style="background:var(--tipo-'+bucket+'-soft); color:var(--tipo-'+bucket+')">'+note.categoriaLabel+'</span>';
    if(note.statusLabel) pills += '<span class="pill" style="background:var(--status-'+note.status+'-soft); color:var(--status-'+note.status+')">'+note.statusLabel+'</span>';
    pills += '<span class="mono" style="color:var(--text-muted); font-size:.82rem">'+fmtDate(note.data, note.hora)+'</span></div>';

    var metaKeys = Object.keys(note.meta||{});
    var refs = metaKeys.length ? '<div class="refrow">'+metaKeys.map(function(k){
      var v = note.meta[k]; v = Array.isArray(v) ? v.join(", ") : v;
      return '<span class="ref-chip mono"><b>'+k+':</b> '+v+'</span>';
    }).join("")+'</div>' : "";
    var tags = (note.tags||[]).length ? '<div class="tagrow">'+note.tags.map(function(t){return '<span class="tag">#'+t+'</span>';}).join("")+'</div>' : "";

    detailEl.innerHTML =
      '<div class="detail-header"><div class="detail-folder">'+projectLabel(note.project)+'</div>'+
      '<h1>'+heading(note)+'</h1>'+pills+refs+tags+'</div>'+
      '<div class="prose">'+wrapTables(html)+'</div>';

    Array.prototype.forEach.call(detailEl.querySelectorAll(".wikilink"), function(a){
      a.addEventListener("click", function(ev){
        ev.preventDefault();
        var tid = a.getAttribute("data-target");
        state.selected = tid;
        state.categoria = "all";
        var target = DATA.notes.filter(function(n){ return n.id===tid; })[0];
        if(target) state.project = "all";
        renderTabs(); renderFilters(); renderList(); renderDetail();
        detailEl.scrollIntoView({block:"start"});
      });
    });
  }

  searchEl.addEventListener("input", function(){ state.query = searchEl.value; renderList(); });

  fetch("./data.json")
    .then(function(res){
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    })
    .then(function(data){
      DATA = data;
      state.selected = data.notes.length ? data.notes[0].id : null;
      subtitleEl.textContent = "Snapshot de " + data.notes.length + " notas em " + data.projects.length + " projetos.";
      var gen = data.generatedAt ? new Date(data.generatedAt) : null;
      footLeft.textContent = gen ? ("Gerado em " + gen.toLocaleString("pt-BR")) : "";
      renderStats(); renderTabs(); renderFilters(); renderList(); renderDetail();
    })
    .catch(function(err){
      detailEl.innerHTML = '<p class="load-state">Não foi possível carregar <code>data.json</code>: '+err.message+'</p>';
      subtitleEl.textContent = "Falha ao carregar o snapshot.";
    });
})();
</script>
</body>
</html>
