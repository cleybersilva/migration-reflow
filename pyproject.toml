[project]
name = "reflow"
version = "0.1.0"
description = "Migração assistida de robôs legados para Power Automate Desktop."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures", "input"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
